services:
  - type: web
    name: looplearn-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set in Render Dashboard with Netlify site URL (e.g., https://looplearn.netlify.app)
      - key: COOKIE_SECURE
        value: "true"
