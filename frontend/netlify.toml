# Netlify configuration for LoopLearn frontend

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA redirect rule: redirects all web routes to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
